name: Budowanie APK

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'ci/**'
      - '.github/workflows/test.yml'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Budowanie
        run: gradle --no-daemon assembleRelease

      - name: Nazwa pliku
        run: cp app/build/outputs/apk/release/app-release.apk wideodomofon.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wideodomofon-apk
          path: wideodomofon.apk

      - name: Wydanie do pobrania
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Wideodomofon 1.0.${{ github.run_number }}
          files: wideodomofon.apk
