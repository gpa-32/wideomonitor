name: Test na emulatorze

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Budowanie APK z bibliotekami dla emulatora (x86_64)
        run: gradle --no-daemon assembleRelease -PextraAbi=x86_64

      - name: Serwer RTSP z obrazem testowym (udaje kamere bramofonu)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          curl -sSL -o mtx.tgz https://github.com/bluenviron/mediamtx/releases/download/v1.9.3/mediamtx_v1.9.3_linux_amd64.tar.gz
          mkdir mtx && tar -xzf mtx.tgz -C mtx
          (cd mtx && nohup ./mediamtx > ../mediamtx.log 2>&1 &)
          sleep 3
          nohup ffmpeg -loglevel error -re -f lavfi -i testsrc=size=1280x720:rate=15 -c:v libx264 -preset ultrafast -tune zerolatency -pix_fmt yuv420p -g 15 -f rtsp -rtsp_transport tcp rtsp://127.0.0.1:8554/live/ch00_0 > ffmpeg.log 2>&1 &
          sleep 3
          cat mediamtx.log | tail -5

      - name: Wlaczenie KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulator Android 11 (tablet) i testy
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: python3 ci/emulator_test.py app/build/outputs/apk/release/app-release.apk

      - name: Wyniki
        if: always()
        run: cat ci-out/report.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wyniki-testu
          path: ci-out

      - name: Zapis wynikow w galezi test-results
        if: always()
        run: |
          cd ci-out
          git init -q -b test-results
          git add -A
          git -c user.name="github-actions" -c user.email="actions@users.noreply.github.com" commit -q -m "Wyniki testu ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" test-results
